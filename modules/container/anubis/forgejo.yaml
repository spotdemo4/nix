bots:
  # Editors fetch JSON schemas without a User-Agent, which the default config
  # denies, so this must come before it.
  - name: allow-raw-json-schemas
    action: ALLOW
    path_regex: ^/[^/]+/[^/]+/raw/.+\.schema\.json$
  - import: (data)/meta/default-config.yaml
  - import: (data)/clients/git.yaml
  - import: (data)/clients/go-get.yaml
  - import: (data)/clients/docker-client.yaml
  - import: (data)/apps/allow-api-routes.yaml

status_codes:
  CHALLENGE: 200
  DENY: 403

store:
  backend: bbolt
  parameters:
    path: /data/anubis.bdb
