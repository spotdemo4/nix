name: Build Nix dependencies
description: Build uncached dependencies without realizing NixOS system closures

inputs:
  flake:
    description: Flake reference containing nixosConfigurations
    default: "."
  workers:
    description: Number of nix-eval-jobs evaluation workers
    default: "3"
  max-memory-size:
    description: Memory budget per nix-eval-jobs worker in MiB
    default: "5000"
  plan-only:
    description: Report uncached dependencies without building them
    default: "false"

runs:
  using: node24
  main: index.mjs
