name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: spotdemo4/nix-init@f8bfbfa0bb30e4367eda405d1c9d28344454b114 # v1.81.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  actions:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: spotdemo4/nix-init@f8bfbfa0bb30e4367eda405d1c9d28344454b114 # v1.81.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor .github
